server:
  port: 1505

spring:
  application:
    name: recommendation-service

  config:
    import: "optional:file:.env[.properties]"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs

  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha

  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET:dev-secret}

# --- Configuración Groq ---
groq:
  api:
    base-url: "https://api.groq.com/openai/v1"
    key: "${GROQ_API_KEY:}"
    model: "${GROQ_MODEL:llama-3.3-70b-versatile}"

# --- Configuración Mistral AI ---
mistral:
  api:
    base-url: "https://api.mistral.ai/v1"
    key: "${MISTRAL_API_KEY:}"
    model: "${MISTRAL_MODEL:mistral-small-latest}"

# --- URLs de microservicios internos (requeridas vía variable de entorno) ---
services:
  planning:
    url: "${PLANNING_SERVICE_URL}"

  profile:
    url: "${PROFILE_SERVICE_URL}"

# --- Feign Client Timeouts ---
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000

      groqAiClient:
        connectTimeout: 5000
        readTimeout: 20000

      mistralAiClient:
        connectTimeout: 5000
        readTimeout: 20000

      planningServiceClient:
        connectTimeout: 3000
        readTimeout: 10000

      engineplanning-service:
        connectTimeout: 3000
        readTimeout: 10000

      profileServiceClient:
        connectTimeout: 3000
        readTimeout: 10000

# --- Resilience4j Configuration ---
resilience4j:
  circuitbreaker:
    instances:
      groqAI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5

      mistralAI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5

  retry:
    instances:
      groqAI:
        maxAttempts: 3
        waitDuration: 2s

        retryExceptions:
          - feign.FeignException
          - java.io.IOException
          - java.net.SocketTimeoutException

      mistralAI:
        maxAttempts: 3
        waitDuration: 2s

        retryExceptions:
          - feign.FeignException
          - java.io.IOException
          - java.net.SocketTimeoutException

  timelimiter:
    instances:
      groqAI:
        timeoutDuration: 20s

      mistralAI:
        timeoutDuration: 20s

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

# =========================================================
# PROFILE LOCAL
# =========================================================

---

spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

  data:
    mongodb:
      uri: mongodb://recommendationservic-mongo:27017/recommendationservic_db
      auto-index-creation: true

  rabbitmq:
    host: localhost
    port: 5672

# =========================================================
# PROFILE QA
# =========================================================

---

spring:
  config:
    activate:
      on-profile: qa

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: PLAIN
    sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"${KAFKA_CONNECTION_STRING}\";"

# =========================================================
# PROFILE PROD
# =========================================================

---

spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  properties:
    security.protocol: SASL_SSL
    sasl.mechanism: PLAIN
    sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username=\"$ConnectionString\" password=\"${KAFKA_CONNECTION_STRING}\";"

