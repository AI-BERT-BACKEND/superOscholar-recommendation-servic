server:
  port: 8086



spring:
  application:
    name: recommendation-service

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

jwt:
  secret: ${JWT_SECRET}

# --- Selector de proveedor de IA ---
# Opciones: "groq" o "gemini"
ai:
  provider: "${AI_PROVIDER:groq}"

# --- Configuración Groq ---
groq:
  api:
    base-url: "https://api.groq.com/openai/v1"
    key: "${GROQ_API_KEY:}"
    model: "${GROQ_MODEL:llama-3.3-70b-versatile}"

# --- URLs de microservicios internos ---
services:
  planning:
    url: "${PLANNING_SERVICE_URL:http://localhost:8087}"

  profile:
    url: "${PROFILE_SERVICE_URL:http://localhost:8081}"

# --- Feign Client Timeouts ---
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000

      externalAiClient:
        connectTimeout: 5000
        readTimeout: 20000

      groqAiClient:
        connectTimeout: 5000
        readTimeout: 20000

      planningServiceClient:
        connectTimeout: 3000
        readTimeout: 10000

      profileServiceClient:
        connectTimeout: 3000
        readTimeout: 10000

# --- Resilience4j Configuration ---
resilience4j:
  circuitbreaker:
    instances:
      groqAI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5

  retry:
    instances:
      groqAI:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - feign.FeignException
          - java.io.IOException
          - java.net.SocketTimeoutException

  timelimiter:
    instances:
      groqAI:
        timeoutDuration: 20s

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

---

spring:
  config:
    activate:
      on-profile: local

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: localhost
    port: 5672

---

spring:
  config:
    activate:
      on-profile: qa

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}

---

spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}