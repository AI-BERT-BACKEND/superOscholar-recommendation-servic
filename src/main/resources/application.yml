server:
  port: ${SERVER_PORT:8086}



spring:
  application:
    name: recommendation-service

  config:
    import: "optional:file:.env[.properties]"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true

jwt:
  secret: ${JWT_SECRET:dev-secret}

# --- Selector de proveedor de IA ---
# Valor esperado: "groq"
ai:
  provider: "${AI_PROVIDER:groq}"

# --- Configuración Groq ---
groq:
  api:
    base-url: "https://api.groq.com/openai/v1"
    key: "${GROQ_API_KEY:}"
    model: "${GROQ_MODEL:llama-3.3-70b-versatile}"

# --- Configuración Gemini ---
gemini:
  api:
    base-url: "https://generativelanguage.googleapis.com/v1beta/models"
    key: "${GEMINI_API_KEY:}"
    model: "${GEMINI_MODEL:gemini-1.5-flash}"

# --- URLs de microservicios internos ---
services:
  planning:
    url: "${PLANNING_SERVICE_URL:http://localhost:8087}"

  profile:
    url: "${PROFILE_SERVICE_URL:http://localhost:8081}"

# --- Feign Client Timeouts ---
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 15000

      groqAiClient:
        connectTimeout: 5000
        readTimeout: 20000

      geminiAiClient:
        connectTimeout: 5000
        readTimeout: 20000

      planningServiceClient:
        connectTimeout: 3000
        readTimeout: 10000

      profileServiceClient:
        connectTimeout: 3000
        readTimeout: 10000

# --- Resilience4j Configuration ---
resilience4j:
  circuitbreaker:
    instances:
      groqAI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
      geminiAI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5

  retry:
    instances:
      groqAI:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - feign.FeignException
          - java.io.IOException
          - java.net.SocketTimeoutException
      geminiAI:
        maxAttempts: 3
        waitDuration: 2s
        retryExceptions:
          - feign.FeignException
          - java.io.IOException
          - java.net.SocketTimeoutException

  timelimiter:
    instances:
      groqAI:
        timeoutDuration: 20s
      geminiAI:
        timeoutDuration: 20s

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

---

spring:
  config:
    activate:
      on-profile: local

  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration}

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/recommendationservic_db}
      auto-index-creation: true

  rabbitmq:
    host: localhost
    port: 5672

---

spring:
  config:
    activate:
      on-profile: qa

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}

---

spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
